[package]
name = "scancbus-uploader"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "DigitalOcean Spaces and ScanCBus uploader for Trunk Recorder Pro"
repository = "https://github.com/n71fs/trpro-scancbus-uploader"
publish = false

[dependencies]
trunk-recorder-plugin = "=0.8.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
url = "2"

[profile.release]
strip = true
lto = true
